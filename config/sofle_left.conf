# Left half OLED (central):
# Bongo Cat aporreando al ritmo del tecleo (WPM).
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

# Runtime WPM view cycle: builds all five views (bongo cat, luna, number,
# speedometer, graph) and lets you pick which one shows, from a key or
# from ZMK Studio. The choice is saved to flash.
CONFIG_NICE_OLED_WPM_VIEW_SELECTABLE=y

# Report the right half's battery to the host. The central fetches the
# peripheral's level and publishes it as a second Battery Service, labeled
# "Peripheral 0". Most hosts only display the first one; on Linux the
# omarchy-zmk bar plugin reads both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
